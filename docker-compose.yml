version: "3.8"

services:
  # MCP server connecting Claude → AuraDB
  neo4j-mcp:
    build:
      context: ./infrastructure/neo4j
      dockerfile: Dockerfile
    container_name: willow-neo4j-mcp
    ports:
      - "3001:3001"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MCP_PORT=${MCP_PORT}
    networks:
      - willow-network
    volumes:
      - ./core/skills:/skills:ro
      - ./domains:/domains:ro

  # Skill execution API
  willow-api:
    build:
      context: ./core/api
      dockerfile: Dockerfile
    container_name: willow-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    extra_hosts:
      - "bunny:100.105.129.101" # Tailscale IP for Xeon Server
    networks:
      - willow-network
    volumes:
      - ./core/skills:/app/skills:ro
      - ./domains:/app/domains:ro

  # Graph Gateway (Constitution Enforcement)
  # Graph Gateway (Constitution Enforcement)
  willow-gateway:
    # Intentionally no build block, using image + command

    image: python:3.11-slim
    container_name: willow-gateway
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./domains:/app/domains:ro
      - ./core:/app/core:ro
      - ./.env:/app/.env:ro
      - ./Inbox:/app/Inbox:ro
    working_dir: /app
    command: >
      sh -c "pip install flask neo4j python-dotenv certifi pyyaml requests && python domains/gateway/service.py"
    networks:
      - willow-network

  # Flask Dashboard
  dashboard:
    build:
      context: ./domains/interface
    container_name: willow-dashboard
    ports:
      - "5001:5001"
    environment:
      - PG_HOST=population-db
      - PG_PORT=5432
      - PG_DB=${POSTGRES_DB}
      - PG_USER=${POSTGRES_USER}
      - PG_PASS=${POSTGRES_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    networks:
      - willow-network
    depends_on:
      - population-db

  n8n:
    image: n8nio/n8n:latest
    container_name: willow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_PATH=/n8n/
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - willow-network

  # MSSQL reader (placeholder - will configure when credentials provided)
  # mssql-reader:
  #   image: mcr.microsoft.com/mssql-tools
  #   container_name: willow-mssql-reader
  #   networks:
  #     - willow-network

  # Population Database (Postgres)
  population-db:
    image: pgvector/pgvector:pg15
    container_name: willow-population-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - population_data:/var/lib/postgresql/data
    networks:
      - willow-network

  # --- MEMORY SERVICES ---

  # Zep (Episodic Memory) - Resurrected
  zep-db:
    image: postgres:15-alpine
    container_name: willow-zep-db
    environment:
      - POSTGRES_USER=zep
      - POSTGRES_PASSWORD=zep_password
      - POSTGRES_DB=zep
    networks:
      - willow-network
    volumes:
      - zep_db_data:/var/lib/postgresql/data

  # --- ACCESSORY SERVICES ---

  # Temporal (Orchestrator)
  temporal:
    image: temporalio/auto-setup:1.22.3
    container_name: willow-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      - temporal-db
    networks:
      - willow-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: willow-temporal-ui
    ports:
      - "8081:8080" # Changed to 8081 to avoid conflict with other services
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:8081
    depends_on:
      - temporal
    networks:
      - willow-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.22.3
    container_name: willow-temporal-admin-tools
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - willow-network
    stdin_open: true
    tty: true

  temporal-db:
    image: postgres:15-alpine
    container_name: willow-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    networks:
      - willow-network
    volumes:
      - temporal_db_data:/var/lib/postgresql/data

  zep:
    image: zepai/zep:latest
    container_name: willow-zep
    ports:
      - "8003:8000"
    environment:
      - ZEP_DB_HOST=zep-db
      - ZEP_DB_PORT=5432
      - ZEP_DB_USER=zep
      - ZEP_DB_PASSWORD=zep_password
      - ZEP_DB_NAME=zep
      - ZEP_OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZEP_LOG_LEVEL=info
    depends_on:
      - zep-db
    networks:
      - willow-network

  # MongoDB (The Vault / Document Archive)
  mongo:
    image: mongo:latest
    container_name: willow-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongopassword}
    volumes:
      - mongo_data:/data/db
    networks:
      - willow-network

  # Graphiti (Experiential Memory)
  graphiti:
    build:
      context: ./infrastructure/memory/graphiti
    container_name: willow-graphiti
    ports:
      - "8002:8000"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - willow-network

  # Willow Sidebar (Mission Control Documentation)
  sidebar:
    build:
      context: ./domains/sidebar
      dockerfile: Dockerfile
    container_name: willow-sidebar
    ports:
      - "3000:80"
    networks:
      - willow-network

  # Reverse Proxy (serving on Port 80)
  proxy:
    build:
      context: ./infrastructure/proxy
    container_name: willow-proxy
    ports:
      - "80:80"
    depends_on:
      - dashboard
      - n8n
      - graphiti
      - sidebar
    networks:
      - willow-network

volumes:
  n8n_data:
  population_data:
  zep_db_data:
  temporal_db_data:
  mongo_data:

networks:
  willow-network:
    driver: bridge
