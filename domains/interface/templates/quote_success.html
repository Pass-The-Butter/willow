<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Submitted - Purely Pets</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            color: #333;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .quote-id {
            background: #f4f6f9;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            border: 1px dashed #667eea;
        }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.8rem 2rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✨</div>
        <h1>Quote Generated!</h1>
        <p>Your quote has been successfully ingested into the Willow Brain.</p>
        <div class="quote-id">{{ quote_id }}</div>
        <a href="/board" class="btn">Back to Mission Control</a>
    </div>
</body>
</html>
