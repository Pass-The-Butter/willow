server {
    listen 80;
    server_name willow.local bunny;

    # Root pointing to Starlight Sidebar (Mission Control)
    location / {
        proxy_pass http://sidebar:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flask Dashboard & Factory
    location /board {
        proxy_pass http://dashboard:5001/board;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /factory {
        proxy_pass http://dashboard:5001/factory;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /people {
        proxy_pass http://dashboard:5001/people;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /quote {
        proxy_pass http://dashboard:5001/quote;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://dashboard:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # location /memory/ {
    #    proxy_pass http://graphiti:8000/;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    # }
}
